name: Deploy to GitHub Pages

on:
  push:
    branches:
      - develop
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: macos-latest
    env:
      # Suppress punycode deprecation warning from dependencies (Node.js 21+)
      NODE_OPTIONS: --disable-warning=DEP0040
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable
      - name: Verify pnpm version
        run: pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Calculate snow fall enabled (Dec 15 - Jan 15)
        id: snow-fall
        run: |
          MONTH=$(date -u +%m)
          DAY=$(date -u +%d)
          # Enable snow fall between Dec 15 and Jan 15 (inclusive)
          if [[ "$MONTH" == "12" && "$DAY" -ge 15 ]] || [[ "$MONTH" == "01" && "$DAY" -le 15 ]]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
          fi
          echo "### Snow Fall Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Date (UTC):** $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "- **Snow Fall Enabled:** \`$(cat $GITHUB_OUTPUT | grep enabled | cut -d= -f2)\`" >> $GITHUB_STEP_SUMMARY

      - name: Build site for visual tests (without snow)
        run: pnpm run build

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm list playwright --depth=0 --json | jq -r '.[0].devDependencies.playwright.version')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run visual tests 📸
        run: pnpm run test:visual

      - name: Rebuild site with snow fall if enabled
        if: steps.snow-fall.outputs.enabled == 'true'
        run: pnpm run build
        env:
          PUBLIC_SNOW_FALL_ENABLED: 'true'

      - name: Upload build artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
