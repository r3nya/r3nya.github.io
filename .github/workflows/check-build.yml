name: Check build

on: pull_request

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Suppress punycode deprecation warning from dependencies (Node.js 21+)
      NODE_OPTIONS: --disable-warning=DEP0040
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@bdf0af2a9d539c0fd91f655344d2934bfd5a2cdd
        with:
          version: 10.30.3

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.tool-versions'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier check
        run: pnpm run format:check

      - name: Run unit tests 🧪
        run: pnpm run test:unit

      - name: Build 🔧
        run: pnpm run build
