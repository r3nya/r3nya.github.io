name: Check build

on: pull_request

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Suppress punycode deprecation warning from dependencies (Node.js 21+)
      NODE_OPTIONS: --disable-warning=DEP0040
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable
      - name: Verify pnpm version
        run: pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier check
        run: pnpm run format:check

      - name: Type check
        run: pnpm run type-check

      - name: Run unit tests 🧪
        run: pnpm run test:unit

      - name: Build 🔧
        run: pnpm run build

  visual:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable
      - name: Verify pnpm version
        run: pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build site without snow
        run: pnpm run build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser and visual tests
        run: pnpm run test:visual
      - name: Check reduced motion with snow enabled
        env:
          PUBLIC_SNOW_FALL_ENABLED: 'true'
        run: |
          pnpm run build
          pnpm run test:visual --project behavior --testNamePattern 'respects reduced-motion preferences for snow'
      - name: Upload visual test failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-test-results
          path: |
            .vitest-attachments/
            src/test/__screenshots__/
          include-hidden-files: true
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [mobile, desktop]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build site
        run: pnpm run build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Check Lighthouse scores
        run: pnpm run test:lighthouse:${{ matrix.profile }} --collect.settings.chromeFlags=--no-sandbox
      - name: Publish Lighthouse job summary
        run: node scripts/lighthouse-job-summary.ts "lighthouse-reports/${{ matrix.profile }}" "lighthouse-${{ matrix.profile }}"
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-${{ matrix.profile }}
          path: |
            lighthouse-reports/
            .lighthouseci/
          include-hidden-files: true
          retention-days: 7
