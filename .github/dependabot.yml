version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    assignees:
      - 'r3nya'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      production:
        dependency-type: 'production'
      dev-tools:
        patterns:
          - 'typescript'
          - 'prettier'
          - 'astro'
          - 'vite'
          - '@astrojs/*'
        update-types:
          - 'minor'
          - 'patch'
      testing:
        patterns:
          - 'vitest'
          - '@testing-library/*'
          - 'playwright'
        update-types:
          - 'minor'
          - 'patch'
      tailwindcss:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/vite'
        update-types:
          - 'minor'
          - 'patch'
      major-updates:
        update-types:
          - 'major'
    assignees:
      - 'r3nya'
